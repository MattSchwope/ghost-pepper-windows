[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-pepper-windows"
version = "0.1.0"
description = "Local-first Windows dictation pipeline for Ghost Pepper Windows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "pyperclip>=1.8.2",
    "requests>=2.31.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
gpw = "gpw.cli:main"

[tool.setuptools.packages.find]
where = ["app/src"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app/src"]
