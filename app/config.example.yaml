app:
  data_dir: "C:/GhostPepperWindows"
  audio_dir: "C:/GhostPepperWindows/audio"
  notes_dir: "C:/GhostPepperWindows/notes"
  logs_dir: "C:/GhostPepperWindows/logs"

recording:
  sample_rate: 16000
  channels: 1
  default_duration_seconds: 8
  input_device: null       # null = Windows default mic, or part of a mic's name such as "Poly BT700"

# The only cloud service. The key is read from .env or the environment, never from here.
openai:
  api_key_env: OPENAI_API_KEY
  transcribe_model: gpt-transcribe
  text_model: gpt-6-luna
  text_reasoning: none
  summary_model: gpt-6.1-sol
  timeout_seconds: 600
  max_retries: 5

transcription:
  languages: [en]
  audio_prep: light        # off | light | strong
  chunk_minutes: 10        # long files are cut at pauses near this length (2-40)
  keywords: []             # extra hints sent with every request; the personal dictionary below is the main list

# Hold-to-talk dictation: `gpw serve` plus app/scripts/hotkey.ahk. Restart from the tray icon after edits.
service:
  port: 8765               # always bound to 127.0.0.1

hotkeys:
  dictate: RCtrl           # hold to talk. Double-tap for hands-free, then tap once to stop
  cancel: Esc              # only caught while recording or transcribing
  add_word: "^!d"          # Ctrl+Alt+D: add the selected word to the dictionary ("" turns it off).
                           # AutoHotkey syntax: ^ Ctrl, ! Alt, + Shift, # Win. Use the left Ctrl;
                           # the right one is the dictate key.
  tap_ms: 250              # a press shorter than this counts as a tap
  double_tap_ms: 400       # the most time allowed between the two taps

dictation:
  audio_prep: light        # off | light | strong (strong runs ffmpeg denoise and adds ~0.2 s)
  silence_peak_dbfs: -35   # clips that never get louder than this are skipped: no API call, no paste
  min_speech_ms: 200       # clips with less loud audio than this are skipped too (a tap, a click)
  upload_format: flac      # flac | wav. FLAC is about half the size, so it uploads faster
  warm_mic: false          # true keeps the mic open with a short pre-roll, if first words get clipped
  preroll_ms: 300
  mic_open_timeout_seconds: 3
  hands_free_max_minutes: 10
  daily_log: true          # append every dictation to <notes_dir>/dictation/YYYY-MM-DD.md
  sounds: true             # start and stop beeps
  paste_restore_ms: 250    # wait this long after pasting before putting the old clipboard back
  prewarm_connection: true # connect to OpenAI on key down, so the upload skips the handshake

# Personal dictionary: terms sent as spelling hints, plus "heard": "Wanted" fixes.
# `gpw dictionary` shows where it is and whether it has errors.
dictionary:
  path: null               # null = <data_dir>/dictionary.yaml, created with examples on first start
  max_keywords: 100        # terms sent per dictation, top of the list first (the API cap is untested)
  auto_learn: true         # experimental: after a paste, watch the text field for learn_seconds; if you
                           # fix a name or acronym (cavaliro -> Kavaliro), save that fix. Reads the
                           # field through Windows UI Automation; nothing leaves the PC.
  learn_seconds: 15

# Light cleanup never changes word choice. The rules run locally in well under a millisecond.
cleanup:
  remove_fillers: true     # drop um, uh, erm
  spoken_commands: true    # say "new line" or "new paragraph" to break the text there
  ai_pass: false           # extra text-model pass (openai.text_model) for punctuation and false starts.
                           # Adds a round trip to every dictation; its answer is thrown away if it
                           # changed a word. Leave off while measuring Phase 1 latency.
  prompt_profile: "dictation_light"

markdown:
  save_notes: true

privacy:
  debug_log_transcripts: false
  delete_audio_after_success: false
